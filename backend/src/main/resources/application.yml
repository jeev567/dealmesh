server:
  port: 8080
  forward-headers-strategy: framework
spring:
  application:
    name: dealmesh
  datasource:
    url: ${DEALMESH_DB_URL:jdbc:sqlite:./dealmesh.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
management:
  endpoints:
    web:
      exposure:
        include: health,info

paypal:
  sandbox:
    client-id: ${PAYPAL_SANDBOX_CLIENT_ID:}
    client-secret: ${PAYPAL_SANDBOX_CLIENT_SECRET:}
    frontend-url: ${DEALMESH_FRONTEND_URL:http://localhost:5173}
